# =============================================================================
# trimum — Hyprland 配置：tokyo-night
#
# 完整 Hyprland 配置（标准 .conf 格式，非 Lua）。
# 配色由 colors.conf 注入，颜色值来源于 desktop/themes/tokyo-night/colors.toml。
#
# 加载链：
#   ~/.config/hypr/hyprland.conf -> current/hyprland.conf -> tokyo-night/hyprland.conf
# 主题切换：trimum-theme set <theme>
# =============================================================================

# ---- 配色：本主题 colors.conf ----
source = $HOME/.config/hypr/tokyo-night/colors.conf

# ---- 通用变量 ----
$terminal    = kitty
$launcher    = wofi --show drun
$wallpaper   = $HOME/.config/hypr/wallpaper.sh

# ---- 显示器：自动检测，优先 preferred 模式 ----
monitor = , preferred, auto, 1

# ---- 启动应用（exec-once，登录时执行一次）----
exec-once = swww-daemon
exec-once = $wallpaper
exec-once = waybar
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = cliphist
exec-once = wl-paste --type text --watch cliphist store
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# =============================================================================
# 快捷键
# =============================================================================

# ---- 工作区切换：SUPER + 1..9 ----
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

# ---- 移动窗口到工作区：SUPER + SHIFT + 1..9 ----
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

# ---- 窗口管理 ----
bind = SUPER, Q, killactive
bind = SUPER, Return, exec, $terminal
bind = SUPER, D, exec, $launcher
bind = SUPER, F, fullscreen
bind = SUPER, V, togglefloating
bind = SUPER, T, togglesplit
bind = SUPER, P, pseudo
bind = SUPER, L, exec, loginctl lock-session
bind = SUPER, M, exit
bind = ALT, Tab, cyclenext
bind = ALT, Tab, bringactivetotop

# ---- 截图（grim + slurp + wl-copy）----
bind = , Print, exec, grim - | wl-copy
bind = SUPER, Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SUPER SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# ---- 音量 / 媒体 / 亮度（PipeWire + playerctl + brightnessctl）----
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ---- 鼠标 ----
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# =============================================================================
# 窗口规则
# =============================================================================

# 浮动 + 居中：设置面板/蓝牙管理器
windowrulev2 = float, class:^(pavucontrol|blueman-manager|nm-connection-editor)$
windowrulev2 = center, class:^(pavucontrol|blueman-manager|nm-connection-editor)$
windowrulev2 = size 40% 45%, class:^(pavucontrol|blueman-manager|nm-connection-editor)$

# wofi 启动器浮动 + 居中
windowrulev2 = float, class:^(wofi)$
windowrulev2 = center, class:^(wofi)$
windowrulev2 = size 35% 40%, class:^(wofi)$

# 文件对话框 / portal 浮动
windowrulev2 = float, title:^(Open File|Select File|Save File).*$
windowrulev2 = float, class:^(xdg-desktop-portal-gtk)$

# 终端与浏览器半透明（配合 blur）
windowrulev2 = opacity 0.95 0.90, class:^(kitty)$
windowrulev2 = opacity 0.97 0.94, class:^(firefox|chromium|brave|zen)$
windowrulev2 = opacity 0.97 0.94, class:.*

# =============================================================================
# 装饰（圆角 / 阴影 / 模糊）
# =============================================================================

general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = $color_accent
    col.inactive_border = $color_muted
    layout = dwindle
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.95
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = 0x66000000
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.17
        noise = 0.02
    }
}

# =============================================================================
# 动画
# =============================================================================

animations {
    enabled = true
    bezier = easeOutCubic, 0.33, 1, 0.68, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    animation = windows, 1, 4, easeOutCubic, popin 80%
    animation = windowsOut, 1, 4, easeOutCubic, popin 80%
    animation = fade, 1, 4, easeOutCubic
    animation = workspaces, 1, 4, easeOutCubic, slide
    animation = border, 1, 5, easeOutExpo
    animation = windowsMove, 1, 4, easeOutExpo
}

# =============================================================================
# 输入
# =============================================================================

input {
    kb_layout = us
    follow_mouse = 1
    float_switch_override_focus = 2

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

binds {
    workspace_back_and_forth = true
    allow_workspace_cycle = true
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    vfr = true
}
