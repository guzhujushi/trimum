# Trimum Ubuntu Desktop — Kitty terminal configuration
# Applied by install.sh. Overrides GNOME Terminal.
# Set as default via: gsettings set org.gnome.shell.extensions.open-any-terminal terminal kitty

font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Window
window_padding_width 8
hide_window_decorations yes
confirm_os_window_close 0

# Scrollback
scrollback_lines 10000
scrollback_pager_history_size 100

# Tab bar
tab_bar_edge bottom
tab_bar_style powerline
tab_bar_min_tabs 2

# Cursor
cursor_shape beam
cursor_beam_thickness 2.0

# Mouse
mouse_hide_wait 2.0
url_color #89b4fa
url_style curly

# Performance
sync_to_monitor no

# Shell integration
shell_integration enabled
allow_remote_control yes

# Colors will be set by theme color files
# include ./colors/current.conf
