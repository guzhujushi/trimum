# trimum Core — Ubuntu 默认配置
# Install location: /opt/trimum/config/config.yaml

core:
  host: "127.0.0.1"
  port: 8321
  socket_path: "/run/trimum/trimum.sock"
  workers: 1
  # HTTP 管理面 token（至少 16 字符）；未设置时 /api/* 一律拒绝，只留 /health。
  # 也可用环境变量 TRIMUM_HTTP_ADMIN_TOKEN 覆盖；本地管理优先走 Unix socket。
  # http_admin_token: "change-me-0123456789abcdef"

logging:
  level: info
  file: "/var/log/trimum/trimum.log"
  format: json

context:
  db_path: "/var/lib/trimum/context.db"

policy:
  path: "/opt/trimum/config/policy.yaml"

agent_manager:
  max_agents: 10
  health_check_interval: 30
  # 资源约束：hard = cgroup 限额必须在 exec 前生效且读回一致，否则拒绝启动；
  # soft = 尽力施加，失败照常运行但 spawn 结果会标注降级。
  # 可用 TRIMUM_RESOURCE_ENFORCEMENT=hard|soft 覆盖；缺失/坏值按 soft。
  resource_enforcement: "soft"
