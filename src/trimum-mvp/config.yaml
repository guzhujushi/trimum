# trimum-mvp 默认配置
# 优先级：环境变量 > 本文件

llm:
  # OpenAI 兼容 API 地址（DeepSeek: https://api.deepseek.com/v1）
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  temperature: 0.2
  max_tokens: 1024
  timeout_seconds: 60
  max_retries: 3

executor:
  timeout_seconds: 60

policy:
  file: "policy.yaml"

audit:
  log_file: "~/.trimum/audit.log"